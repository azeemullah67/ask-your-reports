<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask Your Reports</title>
  <style>
    :root { --bg: #f7f7f5; --card: #fff; --text: #1f2328; --muted: #656d76; --accent: #0b6bcb; --border: #d8dee4; --warn-bg: #fff4e5; --warn: #8a4b00; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .lead { margin: 0 0 24px; color: var(--muted); }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; border: 1px solid var(--border); border-radius: 6px; }
    button { padding: 10px 16px; font: inherit; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 24px; }
    .examples button { background: var(--card); color: var(--accent); border: 1px solid var(--border); padding: 4px 10px; font-size: .9rem; text-align: left; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .card.error { background: var(--warn-bg); border-color: #f0c88a; color: var(--warn); }
    .answer { margin: 0; font-size: 1.05rem; }
    .meta { margin: 8px 0 0; color: var(--muted); font-size: .85rem; }
    .notice { margin: 8px 0 0; padding: 6px 10px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font-size: .85rem; }
    code { font-size: .85rem; }
    /* Only the table scrolls sideways, never the page. Edge shadows show which side has more columns. */
    .table-wrap {
      overflow-x: auto; margin-top: 12px; overscroll-behavior-x: contain; scrollbar-width: thin;
      background:
        linear-gradient(to right, var(--card) 30%, rgba(255, 255, 255, 0)),
        linear-gradient(to left, var(--card) 30%, rgba(255, 255, 255, 0)) 100% 0,
        radial-gradient(farthest-side at 0 50%, rgba(0, 0, 0, .18), transparent),
        radial-gradient(farthest-side at 100% 50%, rgba(0, 0, 0, .18), transparent) 100% 0;
      background-repeat: no-repeat;
      background-size: 40px 100%, 40px 100%, 14px 100%, 14px 100%;
      background-attachment: local, local, scroll, scroll;
    }
    .table-wrap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .table-wrap::-webkit-scrollbar { height: 6px; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: .9rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .scroll-hint { display: none; margin: 8px 0 0; color: var(--muted); font-size: .8rem; }
    .scroll-hint.visible { display: block; }
    footer { margin-top: 32px; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
<main>
  <h1>Ask Your Reports</h1>
  <p class="lead">Ask a question about the (fake) coffee-shop sales data. The AI can only choose from five pre-approved reports. It never writes SQL.</p>

  <form id="ask-form">
    <input id="question" name="question" maxlength="300" autocomplete="off" required
           placeholder="Which products earned the least revenue last month?" aria-label="Your question">
    <button id="ask-button" type="submit">Ask</button>
  </form>

  <div class="examples" aria-label="Example questions">
    <button type="button">Which products earned the least revenue last month?</button>
    <button type="button">Top 3 products this week</button>
    <button type="button">Revenue by category last quarter</button>
    <button type="button">How are sales by region this month?</button>
    <button type="button">Show the monthly revenue trend for 6 months</button>
    <button type="button">What's the weather tomorrow?</button>
  </div>

  <section id="output" aria-live="polite"></section>

  <footer>Demo with fake sample data. Reports: worst_products, top_products, revenue_by_category, sales_by_region, monthly_revenue_trend.</footer>
</main>

<script>
  const form = document.getElementById("ask-form");
  const input = document.getElementById("question");
  const button = document.getElementById("ask-button");
  const output = document.getElementById("output");

  document.querySelectorAll(".examples button").forEach(b =>
    b.addEventListener("click", () => { input.value = b.textContent; form.requestSubmit(); }));

  form.addEventListener("submit", async e => {
    e.preventDefault();
    button.disabled = true;
    output.replaceChildren(el("p", { className: "meta" }, "Thinking..."));
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: input.value })
      });
      const data = await res.json();
      render(data);
    } catch (err) {
      output.replaceChildren(el("div", { className: "card error" }, "Request failed: " + err.message));
    } finally {
      button.disabled = false;
    }
  });

  function render(data) {
    const ok = data.outcome === "Answered";
    const card = el("div", { className: ok ? "card" : "card error" });
    card.append(el("p", { className: "answer" }, data.answer));

    if (data.summaryChecked === false)
      card.append(el("p", { className: "notice" }, "AI summary failed a check, showing a plain summary"));
    if (data.detail) card.append(el("p", { className: "meta" }, "Detail: " + data.detail));

    if (ok) {
      const meta = el("p", { className: "meta" }, "Report ");
      meta.append(el("code", {}, data.report), " with ",
                  el("code", {}, JSON.stringify(data.parameters)), " · " + data.result.range + " · AI: " + data.provider);
      card.append(meta, table(data.result),
                  el("p", { className: "scroll-hint" }, "Scroll the table sideways to see all columns →"));
    }
    output.replaceChildren(card);
    updateScrollHints();
  }

  // Values are formatted once, in C# (ReportFormatting), so the page, the fake client and the AI summary agree.
  // Raw rows are only used to decide which columns are numeric (right-aligned).
  function table(result) {
    const numeric = result.columns.map((_, i) => result.rows.length > 0 && typeof result.rows[0][i] === "number");
    const t = el("table");
    const head = el("tr");
    result.columns.forEach((c, i) => head.append(el("th", { scope: "col", className: numeric[i] ? "num" : "" }, c)));
    t.append(el("thead", {}, head));
    const body = el("tbody");
    result.displayRows.forEach(row => {
      const tr = el("tr");
      row.forEach((v, i) => tr.append(el("td", { className: numeric[i] ? "num" : "" }, v)));
      body.append(tr);
    });
    t.append(body);

    // Focusable so keyboard users can scroll it with the arrow keys.
    const wrap = el("div", { className: "table-wrap", tabIndex: 0 }, t);
    wrap.setAttribute("role", "region");
    wrap.setAttribute("aria-label", "Report results, scrollable sideways");
    return wrap;
  }

  // Show the hint only when the table is wider than its container.
  function updateScrollHints() {
    document.querySelectorAll(".table-wrap").forEach(wrap => {
      const hint = wrap.nextElementSibling;
      if (hint?.classList.contains("scroll-hint"))
        hint.classList.toggle("visible", wrap.scrollWidth > wrap.clientWidth + 1);
    });
  }
  window.addEventListener("resize", updateScrollHints);

  // Builds elements with textContent only, so model or database text is never interpreted as HTML.
  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    children.forEach(c => node.append(c));
    return node;
  }
</script>
</body>
</html>
